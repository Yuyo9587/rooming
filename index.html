<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rooming · Reuniones Federativas</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style id="css">
:root{
  --bg:#f5f2ee; --panel:#ffffff; --ink:#1f1b18; --muted:#6f6760; --line:#e4ddd5;
  --accent:#b3261e; --accent-d:#8c1c16;
  --libre:#2e7d32; --libre-bg:#e8f4e9;
  --parcial:#c77c02; --parcial-bg:#fdf1dc;
  --completa:#46586a; --completa-bg:#e7ecf1;
  --sobre:#c62828; --sobre-bg:#fde7e7;
  --bloq:#8a8580; --bloq-bg:#eeebe7;
  --h:#1e63b5; --h-bg:#e3eefb; --m:#b0307a; --m-bg:#f9e4f0; --n:#7d7770; --n-bg:#eeeae6;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:"Barlow Condensed",Barlow,sans-serif;margin:0;letter-spacing:.2px}
.top{display:flex;align-items:center;gap:16px;padding:12px 20px;background:#1f1b18;color:#fff;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.ev{flex:1;min-width:200px}
.ev h1{font-size:24px;line-height:1.1}
.ev .sub{color:#cfc6bd;font-size:13px;margin-top:2px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.savestate{font-size:13px;color:#cfc6bd;margin-right:4px}
.savestate.dirty{color:#ffd27a}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#f7f4f1}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-d)}
.btn.primary.pulse{box-shadow:0 0 0 0 rgba(255,210,122,.7);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(255,210,122,0)}100%{box-shadow:0 0 0 0 rgba(255,210,122,0)}}
.btn.dark{background:#2f2a26;border-color:#4a433d;color:#fff}
.btn.dark:hover{background:#3b3530}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--sobre);border-color:#f0c9c9}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:7px}
.tabs{display:flex;gap:4px;padding:0 20px;background:#2a2521;overflow-x:auto}
.tabs a{color:#cfc6bd;text-decoration:none;padding:10px 14px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a.on{color:#fff;border-color:var(--accent)}
main{padding:18px 20px 60px;max-width:1500px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card h2{font-size:21px;margin-bottom:10px}
.card h3{font-size:18px;margin-bottom:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack>*+*{margin-top:14px}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=tel],select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #e9b3ae;border-color:var(--accent)}
textarea{width:100%;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea{color:var(--ink);font-weight:400;font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}

/* Board */
.board{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
@media (max-width:900px){.board{grid-template-columns:1fr}}
.side{position:sticky;top:10px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 20px)}
@media (max-width:900px){.side{position:static;max-height:none}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{border-radius:10px;padding:8px 10px;background:#faf8f6;border:1px solid var(--line)}
.stat b{font-family:"Barlow Condensed",Barlow,system-ui,sans-serif;font-size:24px;display:block;line-height:1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat.libre{background:var(--libre-bg);border-color:#cfe6d1}.stat.libre b{color:var(--libre)}
.stat.parcial{background:var(--parcial-bg);border-color:#f3dcb0}.stat.parcial b{color:var(--parcial)}
.stat.completa{background:var(--completa-bg);border-color:#d3dce4}.stat.completa b{color:var(--completa)}
.stat.wide{grid-column:span 2}
.bar{height:8px;border-radius:5px;background:#eee8e2;overflow:hidden;margin-top:6px;display:flex}
.bar i{display:block;height:100%}
.pool{display:flex;flex-direction:column;min-height:180px;overflow:hidden}
.pool.drop{outline:3px dashed var(--accent);outline-offset:-3px}
.pool-list{overflow:auto;display:flex;flex-direction:column;gap:6px;padding:2px;margin-top:8px;min-height:60px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 8px;cursor:grab;user-select:none}
.chip:hover{border-color:#cbbfb3}
.chip.sel,.occ li.sel{outline:2px solid var(--accent);background:#fff4f3}
.chip .pn{font-weight:600;line-height:1.15}
.chip small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.gb{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.g-H .gb{background:var(--h-bg);color:var(--h)}
.g-M .gb{background:var(--m-bg);color:var(--m)}
.g- .gb{background:var(--n-bg);color:var(--n)}
.gb.sug{outline:1.5px dashed currentColor;outline-offset:1px}
.mapgrid{display:grid;grid-template-columns:150px 1fr;gap:6px 10px;align-items:center;font-size:14px}
.mapgrid select{width:100%}
.prev{font-size:13px;max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}
.prev .tbl td,.prev .tbl th{padding:4px 6px}
details summary{cursor:pointer;font-weight:600;font-size:14px;margin-top:10px}
.okmsg{color:var(--libre);font-weight:600}
.dupb{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--sobre);border-radius:5px;padding:0 5px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.dupcard{border:2px solid var(--sobre);background:var(--sobre-bg)}
.duprow{display:flex;gap:8px;align-items:center;border-top:1px solid #f1c3c3;padding:7px 0}
tr.duptr td{background:#fff1f1}
.errmsg{color:var(--sobre);font-weight:600}
.warns{border-left:4px solid var(--parcial);background:#fffaf0}
.warns li{margin:3px 0;font-size:13.5px}
.warns ul{margin:6px 0 0;padding-left:18px}
.selbanner{position:sticky;top:0;z-index:5;background:#1f1b18;color:#fff;border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.selbanner b{color:#ffd27a}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer;font-weight:600;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:#1f1b18;color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:2px 0 12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.floor{margin-bottom:18px}
.floor h4{font-size:17px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.room{background:#fff;border:1px solid var(--line);border-left:6px solid var(--libre);border-radius:11px;padding:9px 10px 8px;box-shadow:var(--shadow);position:relative;transition:transform .08s}
.room.drop{outline:3px dashed var(--accent);outline-offset:1px}
.room.target{cursor:pointer}
.room.target:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.09)}
.room.st-libre{border-left-color:var(--libre)}
.room.st-parcial{border-left-color:var(--parcial);background:linear-gradient(#fffdf8,#fff)}
.room.st-completa{border-left-color:var(--completa);background:#f9fafb}
.room.st-sobre{border-left-color:var(--sobre);background:var(--sobre-bg)}
.room.st-bloq{border-left-color:var(--bloq);background:repeating-linear-gradient(135deg,#f4f1ee 0 8px,#ece8e4 8px 16px)}
.rh{display:flex;align-items:baseline;gap:7px}
.rh .num{font-family:"Barlow Condensed",Barlow,system-ui,sans-serif;font-weight:700;font-size:22px;line-height:1}
.rh .tipo{font-size:12.5px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 8px;white-space:nowrap}
.pill.libre{background:var(--libre-bg);color:var(--libre)}
.pill.parcial{background:var(--parcial-bg);color:var(--parcial)}
.pill.completa{background:var(--completa-bg);color:var(--completa)}
.pill.sobre{background:#f9d0d0;color:var(--sobre)}
.pill.bloq{background:#e2ddd8;color:#5f5a55}
.beds{display:flex;gap:4px;margin:6px 0 4px}
.beds i{width:16px;height:7px;border-radius:3px;background:#e6e0da}
.beds i.H{background:var(--h)}.beds i.M{background:var(--m)}.beds i.N{background:var(--n)}
.occ{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.occ li{display:flex;align-items:center;gap:7px;border-radius:7px;padding:3px 4px;cursor:grab}
.occ li:hover{background:#f6f2ee}
.occ li .pn{flex:1;font-weight:600;font-size:14px;line-height:1.1;min-width:0}
.occ li .pn small{display:block;font-weight:400;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.occ li.llego .pn::after{content:" ✓";color:var(--libre)}
.occ li.empty{color:#a59c93;font-size:13px;cursor:default;border:1px dashed #ddd5cc;justify-content:center;padding:4px}
.room.target .occ li.empty{border-color:var(--accent);color:var(--accent)}
.ib{border:0;background:transparent;cursor:pointer;color:#a59c93;font-size:15px;padding:2px 5px;border-radius:5px;line-height:1}
.ib:hover{background:#eee6de;color:var(--ink)}
.rflags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.flag{font-size:11.5px;border-radius:6px;padding:1px 6px;background:#f1ece7;color:#5f5a55;font-weight:600}
.flag.warn{background:#fde7e7;color:var(--sobre)}
.flag.gH{background:var(--h-bg);color:var(--h)}.flag.gM{background:var(--m-bg);color:var(--m)}
.rnote{font-size:12px;color:var(--muted);margin-top:4px;font-style:italic}
.empty-state{text-align:center;padding:50px 20px}
.empty-state h2{font-size:28px;margin-bottom:8px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:6px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:5px 6px;border-bottom:1px solid #efe9e3;vertical-align:middle}
.tbl input[type=text],.tbl input[type=tel],.tbl select{width:100%;padding:5px 7px}
.tbl input[type=number]{width:70px;padding:5px 7px}
.tblwrap{overflow-x:auto}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.cq{display:flex;gap:6px;flex-wrap:wrap}
.cq span{background:#f3eee9;border-radius:7px;padding:3px 8px;font-size:13px}

/* modal / toast */
.mb{position:fixed;inset:0;background:rgba(25,20,17,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;z-index:50;overflow:auto}
.md{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.md h2{font-size:23px;margin-bottom:12px}
.md .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.md .foot .left{margin-right:auto}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;background:#fff;width:100%;text-align:left;margin-bottom:8px}
.opt:hover{border-color:var(--accent);background:#fff8f7}
.opt b{display:block}
.opt span{font-size:13px;color:var(--muted)}
.opt .ic{font-size:22px;line-height:1}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#1f1b18;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:14px;max-width:90vw}
.kbd{font-family:ui-monospace,monospace;font-size:12.5px;background:#f3eee9;border-radius:5px;padding:1px 5px}
</style>
</head>

var CUART_NORM = CUARTELES.map(function(c){ return normCuartel(c); });
function normCuartel(t){ return sinTildes(String(t||'')).toUpperCase().replace(/^(SOCIEDAD|ASOCIACION|CUARTEL)?\s*(DE\s+)?BOMBEROS\s+VOLUNTARIOS\s+(DE\s+)?/,'').replace(/[^A-Z0-9 ]+/g,' ').replace(/\s+/g,' ').trim(); }

function selectCuartel(val, attrs, vacio){

/* ---------- estado ---------- */
function defaultState(){
  return { v:1, updatedAt:0,
    evento:{ nombre:'Reunión Federativa', hotel:'', ciudad:'', fechaIn:'', fechaOut:'', contacto:'', notas:'', sheetUrl:'', sheetSync:0, mapeo:null, opciones:null, descartados:[] },

/* ---------- consultas ---------- */
function tipoOf(h){ for(var i=0;i<state.tipos.length;i++) if(state.tipos[i].id===h.tipoId) return state.tipos[i]; return {nombre:'(sin tipo)', cap:1}; }
function capOf(h){ return Math.max(0, parseInt(tipoOf(h).cap,10)||0); }
function occOf(h){ return state.pers.filter(function(p){ return p.habId===h.id; }); }
function habById(id){ for(var i=0;i<state.habs.length;i++) if(state.habs[i].id===id) return state.habs[i]; return null; }
function persById(id){ for(var i=0;i<state.pers.length;i++) if(state.pers[i].id===id) return state.pers[i]; return null; }
function estadoHab(h){
  if(h.bloqueada) return 'bloq';
  var o=occOf(h).length, c=capOf(h);
  if(o===0) return 'libre'; if(o<c) return 'parcial'; if(o===c) return 'completa'; return 'sobre';
}
var EST_TXT = {libre:'Libre', parcial:'A medio ocupar', completa:'Completa', sobre:'Sobrecupo', bloq:'Bloqueada'};
function generosHab(h){
  var s={}; occOf(h).forEach(function(p){ s[p.genero||'N']=1; }); return Object.keys(s);
}
function mezcla(h){
  if(h.mixta) return false;
  var g = generosHab(h).filter(function(x){return x!=='N';});
  return g.length > 1;
}
function etiquetaHab(h){ return 'Hab. ' + h.num; }
function cuarteles(){
  var s={}; state.pers.forEach(function(p){ var g=grupoDe(p); if(g) s[g]=1; }); return Object.keys(s).sort(natCmp);
}
function pisos(){

}
function habsOrdenadas(){

}

    var e=estadoHab(h);
    if(mezcla(h)) w.push({t:'Hab. '+h.num+': mezcla hombres y mujeres', hab:h.id});
    if(e==='sobre') w.push({t:'Hab. '+h.num+': sobrecupo ('+occOf(h).length+'/'+capOf(h)+')', hab:h.id});
    if(h.bloqueada && occOf(h).length) w.push({t:'Hab. '+h.num+': está bloqueada y tiene gente', hab:h.id});
  });
  var sinG = state.pers.filter(function(p){return !p.genero;}).length;
  if(sinG) w.push({t: sinG+' persona'+(sinG>1?'s':'')+' sin género cargado'});

}

/* ---------- posibles duplicados ---------- */
var DUP={pares:[], porId:{}}, lastDupCount=-1;
function tokensNombre(n){ return sinTildes(n).toLowerCase().replace(/[^a-z ]/g,' ').split(/\s+/).filter(function(w){ return w.length>1 && !PARTICULAS[w]; }); }
function dniNum(p){ var d=String(p.dni||'').replace(/\D/g,''); return (d.length>=7 && d.length<=9) ? d : ''; }
function parKey(a,b){ return a<b ? a+'|'+b : b+'|'+a; }
function casiIgual(a,b){
  if(a.length!==b.length) return false;
  var dif=[]; for(var i=0;i<a.length;i++) if(a[i]!==b[i]) dif.push(i);
  if(dif.length<=1) return true;
  return dif.length===2 && dif[1]===dif[0]+1 && a[dif[0]]===b[dif[1]] && a[dif[1]]===b[dif[0]];
}
function calcDuplicados(){
  var P=state.pers, ign={}, pares=[], porId={};
  (state.noDup||[]).forEach(function(k){ ign[k]=1; });
  var info=P.map(function(p){ return {p:p, d:dniNum(p), t:tokensNombre(p.nombre||'')}; });
  for(var i=0;i<info.length;i++) for(var j=i+1;j<info.length;j++){
    var A=info[i], B=info[j];
    if(ign[parKey(A.p.id,B.p.id)]) continue;
    var motivo='';
    if(A.d && A.d===B.d) motivo='mismo DNI';
    else {
      var com=A.t.filter(function(t){ return B.t.indexOf(t)>-1; }).length;
      var dniOk = !A.d || !B.d || casiIgual(A.d,B.d);
      if(A.t.length && B.t.length && com>=2 && com===Math.min(A.t.length,B.t.length) && dniOk) motivo='mismo nombre';
      else if(A.d && B.d && com>=1 && casiIgual(A.d,B.d)) motivo='DNI casi igual';
    }
    if(motivo){
      pares.push({a:A.p, b:B.p, motivo:motivo});
      (porId[A.p.id]=porId[A.p.id]||[]).push(B.p.id);
      (porId[B.p.id]=porId[B.p.id]||[]).push(A.p.id);
    }
  }
  DUP={pares:pares, porId:porId};
  if(pares.length > lastDupCount && lastDupCount>=0 || (lastDupCount<0 && pares.length)){
    var n=pares.length;
    setTimeout(function(){ toast('⚠ '+(n===1?'Hay 1 posible persona duplicada':'Hay '+n+' posibles personas duplicadas')+'. Revisalo antes de asignar.', 5500); }, 50);
  }
  lastDupCount=pares.length;
}
function dupDe(p){ return (DUP.porId[p.id]||[]).map(persById).filter(Boolean); }
function dupBadge(p){
  var d=dupDe(p); if(!d.length) return '';
  return ' <span class="dupb" title="Posible duplicado de: '+esc(d.map(function(x){return x.nombre;}).join(', '))+'">⚠ ¿Duplicado?</span>';
}
function etiquetaUbic(p){ var h=habById(p.habId); return h?'Hab. '+h.num:'sin habitación'; }
function cardDuplicados(){
  var ps=DUP.pares; if(!ps.length) return '';
  return '<div class="card dupcard"><b>⚠ Posibles duplicados ('+ps.length+')</b>'+
    '<p class="small muted" style="margin:4px 0 6px">Parece que estas personas se anotaron dos veces. Revisalas para no darles dos habitaciones.</p>'+
    ps.slice(0,6).map(function(x,i){
      return '<div class="duprow"><div style="flex:1;min-width:0" class="small"><b>'+esc(x.a.nombre)+'</b> ('+etiquetaUbic(x.a)+')<br><b>'+esc(x.b.nombre)+'</b> ('+etiquetaUbic(x.b)+')<br><span class="muted">'+esc(x.motivo)+'</span></div>'+
        '<button class="btn sm" data-dup="'+i+'">Revisar</button></div>';
    }).join('')+(ps.length>6?'<div class="small muted">…y '+(ps.length-6)+' más</div>':'')+'</div>';
}
function revisarDuplicado(i){
  var x=DUP.pares[i]; if(!x) return;
  var A=x.a, B=x.b;
  var fila=function(lbl,fa,fb){ var va=fa(A)||'—', vb=fb(B)||'—'; return '<tr><th style="text-align:left">'+lbl+'</th><td'+(va!==vb?' style="background:#fff6d6"':'')+'>'+esc(va)+'</td><td'+(va!==vb?' style="background:#fff6d6"':'')+'>'+esc(vb)+'</td></tr>'; };
  var f=function(k){ return function(p){ return p[k]; }; };
  var md=abrirModal('<h2>¿Es la misma persona?</h2><p class="small muted" style="margin-top:-6px">Motivo: '+esc(x.motivo)+'. En amarillo, lo que cambia.</p>'+
    '<table class="tbl"><thead><tr><th></th><th>Persona 1</th><th>Persona 2</th></tr></thead><tbody>'+
      fila('Nombre',f('nombre'),f('nombre'))+fila('DNI',f('dni'),f('dni'))+fila('Cuartel',grupoDe,grupoDe)+fila('Cargo',f('cargo'),f('cargo'))+
      fila('Cubre Fed.',f('cubre'),f('cubre'))+fila('Habitación',etiquetaUbic,etiquetaUbic)+fila('Notas',f('notas'),f('notas'))+
    '</tbody></table>'+
    '<div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">'+
      '<button class="btn primary" id="dQ1">Es la misma: dejar Persona 1 y borrar Persona 2</button>'+
      '<button class="btn primary" id="dQ2">Es la misma: dejar Persona 2 y borrar Persona 1</button>'+
      '<button class="btn" id="dNo">Son personas distintas (no avisar más)</button>'+
    '</div><div class="foot"><button class="btn" id="dCan">Cancelar</button></div>');
  var quedar=function(keep, del){
    cerrarModal();
    commit(function(){
      if(!keep.habId && del.habId) keep.habId=del.habId;
      ['dni','cargo','cuartel','region','notas'].forEach(function(k){ if(!keep[k] && del[k]) keep[k]=del[k]; });
      if(del.llego) keep.llego=true;
      descartar(del);
      state.pers=state.pers.filter(function(z){ return z.id!==del.id; });
    });
    toast('Se borró a '+del.nombre+' (quedó '+keep.nombre+')', 4000);
  };
  $('#dQ1',md).onclick=function(){ quedar(A,B); };
  $('#dQ2',md).onclick=function(){ quedar(B,A); };
  $('#dNo',md).onclick=function(){ cerrarModal(); commit(function(){ state.noDup=state.noDup||[]; state.noDup.push(parKey(A.id,B.id)); }); toast('Listo, no se vuelve a avisar por ese par'); };
  $('#dCan',md).onclick=cerrarModal;
}
document.addEventListener('click', function(e){
  var b=e.target.closest && e.target.closest('[data-dup]'); if(!b) return;
  e.stopPropagation(); revisarDuplicado(parseInt(b.dataset.dup,10));
}, true);

/* ---------- asignación ---------- */
function problemasAsignar(p, h){
  var probs=[];
  var occ=occOf(h).filter(function(o){return o.id!==p.id;});
  if(h.bloqueada) probs.push('la habitación está bloqueada');
  if(occ.length >= capOf(h)) probs.push('ya está completa ('+occ.length+'/'+capOf(h)+')');
  if(!h.mixta && p.genero && occ.some(function(o){ return o.genero && o.genero!==p.genero; }))
    probs.push('quedarían hombres y mujeres juntos');
  dupDe(p).forEach(function(d){ if(d.habId) probs.push('parece la misma persona que '+d.nombre+', que ya está en la Hab. '+(habById(d.habId)||{}).num); });
  return probs;
}
function asignar(pid, hid){
  var p=persById(pid); if(!p) return;
  if(hid===null){ if(p.habId){ commit(function(){ p.habId=null; }); toast(p.nombre+' quedó sin habitación'); } return; }
  var h=habById(hid); if(!h || p.habId===hid) return;
  var probs=problemasAsignar(p,h);
  var hacer=function(){ commit(function(){ p.habId=hid; p.llego = p.llego; }); toast(p.nombre+' → Hab. '+h.num); };
  if(probs.length){
    confirmar('¿Asignar igual?', '<p>Al poner a <b>'+esc(p.nombre)+'</b> en la <b>Hab. '+esc(h.num)+'</b>: '+probs.map(esc).join(', ')+'.</p>'+
      (probs.indexOf('quedarían hombres y mujeres juntos')>-1?'<p class="muted small">Si es una pareja o familia, marcá la habitación como <b>“mixta permitida”</b> y no vuelve a avisar.</p>':''),
      'Asignar igual').then(function(ok){ if(ok) hacer(); });
  } else hacer();
}
function autoAsignar(){
  var libres = state.pers.filter(function(p){ return !p.habId; });
  if(!libres.length){ toast('No hay personas sin habitación'); return; }
  var res={ok:0, no:0, sinG:0, dup:0};
  commit(function(){
    var grupos={};
    libres.forEach(function(p){ var k=(p.genero||'?')+'|'+grupoDe(p).toLowerCase(); (grupos[k]=grupos[k]||[]).push(p); });
    var orden=Object.keys(grupos).map(function(k){return grupos[k];}).sort(function(a,b){return b.length-a.length;});
    orden.forEach(function(g){
      g.sort(function(a,b){ return natCmp(a.nombre,b.nombre); });
      g.forEach(function(p,i){
        if(!p.genero){ res.sinG++; return; }
        if(dupDe(p).some(function(d){ return d.habId; })){ res.dup++; return; }
        var resto=g.length-i, best=null, bs=-1e9;
        state.habs.forEach(function(h){
          if(h.bloqueada) return;
          var occ=occOf(h), c=capOf(h);
          if(occ.length>=c) return;
          if(occ.some(function(o){return !o.genero;})) return;
          if(!h.mixta && occ.some(function(o){return o.genero!==p.genero;})) return;
          var s=0;
          s += occ.filter(function(o){ return grupoDe(o) && grupoDe(o).toLowerCase()===grupoDe(p).toLowerCase(); }).length*100;
          if(occ.length) s+=40;
          s -= Math.abs((c-occ.length) - resto)*8;
          if(tipoOf(h).compartida) s-=60;
          if(h.mixta) s-=30;
          if(s>bs){ bs=s; best=h; }
        });
        if(best){ p.habId=best.id; res.ok++; } else res.no++;
      });
    });
  });
  var msg = res.ok+' asignada'+(res.ok!==1?'s':'');
  if(res.no) msg += ' · '+res.no+' sin lugar compatible';
  if(res.sinG) msg += ' · '+res.sinG+' sin género (no se asignaron)';
  if(res.dup) msg += ' · '+res.dup+' posible'+(res.dup!==1?'s':'')+' duplicado'+(res.dup!==1?'s':'')+' (no se asignaron)';
  toast(msg, 4500);
}

function roomCard(h){

  var beds=''; for(var i=0;i<Math.max(cap,occ.length);i++){ var o=occ[i]; beds+='<i class="'+(o?(o.genero||'N'):'')+'"></i>'; }

function filtraHab(h){
  var est=estadoHab(h);
  if(ui.fEst!=='todas'){
    if(ui.fEst==='completa' && !(est==='completa'||est==='sobre')) return false;
    if(ui.fEst!=='completa' && est!==ui.fEst) return false;
  }
  if(ui.fTipo && h.tipoId!==ui.fTipo) return false;
  if(ui.fPiso!=='' && ui.fPiso!==undefined && ui.fPiso!==null && ui.fPiso!=='__todos' && (h.piso||'')!==ui.fPiso) return false;
  if(ui.fGen){
    var g=generosHab(h).filter(function(x){return x!=='N';});
    if(ui.fGen==='H' && !(g.length===1&&g[0]==='H')) return false;
    if(ui.fGen==='M' && !(g.length===1&&g[0]==='M')) return false;
    if(ui.fGen==='mix' && !(g.length>1 || h.mixta)) return false;
  }
  if(ui.q){
    var q=ui.q.toLowerCase();
    var txt=(h.num+' '+tipoOf(h).nombre+' '+(h.notas||'')+' '+occOf(h).map(function(p){return p.nombre+' '+grupoDe(p);}).join(' ')).toLowerCase();
    if(txt.indexOf(q)<0) return false;
  }
  return true;
}

/* delegación de eventos en la vista (click + drag) */
function bindViewEvents(){
  var v=$('#view');
  v.addEventListener('click', function(e){
    if(ui.tab!=='rooming') return;
    var t=e.target;
    var ed=t.closest('[data-editp]'); if(ed){ e.stopPropagation(); editarPersona(ed.dataset.editp); return; }
    var eh=t.closest('[data-edith]'); if(eh){ e.stopPropagation(); editarHab(eh.dataset.edith); return; }
    var un=t.closest('[data-unassign]'); if(un){ e.stopPropagation(); ui.sel=null; asignar(un.dataset.unassign,null); return; }
    var pk=t.closest('[data-pick]');
    var room=t.closest('.room');
    if(pk && !(ui.sel && room && ui.sel!==pk.dataset.pick)){
      ui.sel = ui.sel===pk.dataset.pick ? null : pk.dataset.pick; render(); return;
    }
    if(ui.sel && room){ var id=ui.sel; ui.sel=null; asignar(id, room.dataset.hab); render(); return; }
    if(ui.sel && t.closest('#pool')){ var id2=ui.sel; ui.sel=null; asignar(id2,null); render(); return; }
  });
  var dragId=null;
  v.addEventListener('dragstart', function(e){
    var el=e.target.closest && e.target.closest('[data-pid]'); if(!el) return;
    dragId=el.dataset.pid; try{ e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed='move'; }catch(x){}
  });
  v.addEventListener('dragend', function(){ dragId=null; $all('.drop').forEach(function(x){x.classList.remove('drop');}); });
  v.addEventListener('dragover', function(e){
    if(!dragId) return;
    var tg=e.target.closest('.room, #pool'); if(!tg) return;
    e.preventDefault(); $all('.drop').forEach(function(x){ if(x!==tg) x.classList.remove('drop'); }); tg.classList.add('drop');
  });
  v.addEventListener('drop', function(e){
    if(!dragId) return;
    var tg=e.target.closest('.room, #pool'); if(!tg) return;
    e.preventDefault(); var id=dragId; dragId=null; ui.sel=null;
    if(tg.id==='pool') asignar(id,null); else asignar(id, tg.dataset.hab);
    render();
  });
}

function numerar(desde, cant, piso){
  var out=[];
  var m=/^(.*?)(\d+)$/.exec(desde||'');
  if(!desde){
    var base = /^\d+$/.test(piso) ? parseInt(piso,10)*100+1 : (function(){ var mx=0; state.habs.forEach(function(h){ var n=parseInt(h.num,10); if(n>mx) mx=n; }); return mx+1; })();
    for(var i=0;i<cant;i++) out.push(String(base+i));
  } else if(m){
    var pre=m[1], n=parseInt(m[2],10), w=m[2].length;
    for(var j=0;j<cant;j++){ var s=String(n+j); while(s.length<w) s='0'+s; out.push(pre+s); }
  } else {
    for(var k=0;k<cant;k++) out.push(cant>1? desde+' '+(k+1) : desde);
  }
  return out;
}

function sinTildes(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,''); }
function sheetIdDe(txt){
  txt=String(txt||'').trim();
  var m=/\/d\/([a-zA-Z0-9_-]{20,})/.exec(txt); if(m) return m[1];
  if(/^[a-zA-Z0-9_-]{25,}$/.test(txt)) return txt;
  return '';
}
function parseCSV(text){
  var rows=[], row=[], f='', q=false, c;
  text=String(text).replace(/^﻿/,'');
  for(var i=0;i<text.length;i++){
    c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else if(c!=='\r') f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(x){ return String(x).trim(); }); });
}
function b64utf8(b64){
  var bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function urlCsvWeb(txt){
  txt=String(txt||'').trim().replace(/#.*$/,'');
  if(!/^https:\/\/docs\.google\.com\/spreadsheets\//.test(txt)) return null;
  var m=/\/d\/e\/[a-zA-Z0-9_-]+/.exec(txt);
  if(m){
    var u=txt.replace('/pubhtml','/pub');
    if(/[?&]output=/.test(u)) u=u.replace(/output=[a-z]+/,'output=csv'); else u+=(u.indexOf('?')>-1?'&':'?')+'output=csv';
    return {tipo:'pub', url:u};
  }
  var id=sheetIdDe(txt); if(!id) return null;
  var gid=(/[?&#]gid=(\d+)/.exec(String(arguments[0]))||[])[1];
  return {tipo:'doc', id:id, gid:gid||''};
}

function bajarTexto(url){
  return fetch(url+(url.indexOf('?')>-1?'&':'?')+'_='+Date.now(), {cache:'no-store'}).then(function(r){
    if(!r.ok) throw {status:r.status}; return r.text();
  }).then(function(t){ if(/^\s*</.test(t)) throw {html:true}; var f=parseCSV(t); if(f.length<1) throw {vacio:true}; return f; });
}
function gvizJsonp(id, gid){
  return new Promise(function(res, rej){
    var cb='__gv'+Date.now()+Math.floor(Math.random()*1e4), sc=document.createElement('script');
    var t=setTimeout(function(){ fin(); rej({timeout:true}); }, 15000);
    function fin(){ clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb]=undefined; } if(sc.parentNode) sc.parentNode.removeChild(sc); }
    window[cb]=function(resp){
      fin();
      try{
        if(!resp || resp.status==='error' || !resp.table) return rej({gviz:true});
        var tb=resp.table;
        var head=tb.cols.map(function(c){ return c.label||''; });
        var rows=(tb.rows||[]).map(function(r){ return (r.c||[]).map(function(c){ return c==null?'':(c.f!=null?String(c.f):(c.v==null?'':String(c.v))); }); });
        if(!head.some(function(h){return h;}) && rows.length){ head=rows.shift(); }
        res([head].concat(rows));
      }catch(e){ rej({gviz:true}); }
    };
    sc.onerror=function(){ fin(); rej({script:true}); };
    sc.src='https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:json;responseHandler:'+cb+'&headers=1'+(gid?'&gid='+gid:'')+'&_='+Date.now();
    document.head.appendChild(sc);
  });
}
function leerFilasWeb(w){
  if(w.tipo==='pub') return bajarTexto(w.url);
  var base='https://docs.google.com/spreadsheets/d/'+w.id;
  return bajarTexto(base+'/export?format=csv'+(w.gid?'&gid='+w.gid:''))
    .catch(function(){ return bajarTexto(base+'/gviz/tq?tqx=out:csv&headers=1'+(w.gid?'&gid='+w.gid:'')); })
    .catch(function(){ return gvizJsonp(w.id, w.gid); });
}

function guardarArchivo(nombre, data){

  }

    var b = data instanceof Blob ? data : new Blob([data],{type:'application/octet-stream'});
    var url=URL.createObjectURL(b); var a=document.createElement('a'); a.href=url; a.download=nombre; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);

}

/* ---------- guardar en Google (para usar en varios dispositivos) ---------- */
var CODIGO_GS = "// ===== Rooming · Reuniones Federativas — guardado en Google =====\n// Cambiá 1234 por una clave tuya (solo números o letras, sin espacios).\n// Después la vas a escribir en la app.\nvar CLAVE = '1234';\n\n// ----- No hace falta tocar nada de acá para abajo -----\nfunction doGet(e) {\n  if (!claveOk_(e && e.parameter ? e.parameter.clave : '')) return json_({ ok: false, error: 'clave' });\n  var datos = leer_();\n  return json_({ ok: true, updatedAt: datos ? (datos.updatedAt || 0) : 0, state: datos });\n}\n\nfunction doPost(e) {\n  var body;\n  try { body = JSON.parse(e.postData.contents); } catch (err) { return json_({ ok: false, error: 'formato' }); }\n  if (!claveOk_(body.clave)) return json_({ ok: false, error: 'clave' });\n  if (!body.state || typeof body.state !== 'object') return json_({ ok: false, error: 'formato' });\n  var lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    var actual = leer_();\n    var fechaActual = actual ? (actual.updatedAt || 0) : 0;\n    if (!body.forzar && actual && fechaActual !== (body.base || 0)) {\n      return json_({ ok: false, conflicto: true, updatedAt: fechaActual });\n    }\n    guardar_(body.state);\n    try { tablaLegible_(body.state); } catch (err) {}\n    return json_({ ok: true, updatedAt: body.state.updatedAt || 0 });\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction claveOk_(c) { return String(c || '') === String(CLAVE); }\n\nfunction json_(obj) {\n  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);\n}\n\nfunction hoja_(nombre) {\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  return ss.getSheetByName(nombre) || ss.insertSheet(nombre);\n}\n\n// Los datos se guardan en la hoja \"_datos\", en pedazos (cada celda tiene un límite).\nfunction leer_() {\n  var h = hoja_('_datos');\n  var n = h.getLastRow();\n  if (!n) return null;\n  var txt = h.getRange(1, 1, n, 1).getValues().map(function (r) { return String(r[0]).slice(1); }).join('');\n  if (!txt) return null;\n  try { return JSON.parse(txt); } catch (err) { return null; }\n}\n\nfunction guardar_(state) {\n  var h = hoja_('_datos');\n  var txt = JSON.stringify(state);\n  var partes = [];\n  for (var i = 0; i < txt.length; i += 40000) partes.push(['x' + txt.substr(i, 40000)]);\n  h.clear();\n  if (partes.length) h.getRange(1, 1, partes.length, 1).setValues(partes);\n}\n\n// Hoja \"Rooming\": una tabla para leer o imprimir. Se rehace en cada guardado.\nfunction tablaLegible_(s) {\n  var tipos = {}; (s.tipos || []).forEach(function (t) { tipos[t.id] = t; });\n  var habs = (s.habs || []).slice().sort(function (a, b) {\n    return String(a.piso || '').localeCompare(String(b.piso || ''), 'es', { numeric: true }) ||\n           String(a.num).localeCompare(String(b.num), 'es', { numeric: true });\n  });\n  var pers = s.pers || [];\n  var gen = { H: 'Hombre', M: 'Mujer' };\n  var filas = [['Habitación', 'Piso', 'Tipo', 'Huésped', 'DNI', 'Cuartel', 'Región', 'Género', 'Cargo', 'Cubre Federación', 'Llegó']];\n  habs.forEach(function (h) {\n    var t = tipos[h.tipoId] || { nombre: '' };\n    var occ = pers.filter(function (p) { return p.habId === h.id; });\n    if (!occ.length) filas.push([h.num, h.piso || '', t.nombre, h.bloqueada ? '(bloqueada)' : '(libre)', '', '', '', '', '', '', '']);\n    occ.forEach(function (p) {\n      filas.push([h.num, h.piso || '', t.nombre, p.nombre, p.dni || '', p.cuartel || '', p.region || '', gen[p.genero] || '', p.cargo || '', p.cubre || '', p.llego ? 'Sí' : '']);\n    });\n  });\n  pers.filter(function (p) { return !p.habId; }).forEach(function (p) {\n    filas.push(['SIN HABITACIÓN', '', '', p.nombre, p.dni || '', p.cuartel || '', p.region || '', gen[p.genero] || '', p.cargo || '', p.cubre || '', '']);\n  });\n  var r = hoja_('Rooming');\n  r.clear();\n  r.getRange(1, 1, filas.length, filas[0].length).setNumberFormat('@').setValues(filas);\n  r.getRange(1, 1, 1, filas[0].length).setFontWeight('bold').setBackground('#b3261e').setFontColor('#ffffff');\n  r.setFrozenRows(1);\n}\n";
var NUBE_KEY='rooming-nube';
var nube=null, nubeEst={estado:'off', msg:''}, nubeTimer=null, nubeOcupada=false;
try{ nube=JSON.parse(localStorage.getItem(NUBE_KEY)); }catch(e){}
function nubeGuardarCfg(){ try{ if(nube) localStorage.setItem(NUBE_KEY, JSON.stringify(nube)); else localStorage.removeItem(NUBE_KEY); }catch(e){} }
function nubeActiva(){ return !!(nube && nube.url && !ART); }
function nubeUrlOk(u){ return /^https:\/\/script\.google(usercontent)?\.com\/.+/.test(String(u||'').trim()); }
function guardarLocalSinTocar(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function nubeSetEst(est,msg){ nubeEst={estado:est,msg:msg||''}; if(capsReady) renderHeader(); var c=$('#nubeEstado'); if(c) c.innerHTML=nubeEstadoHtml(); }
function nubeEstadoHtml(){
  var m={ok:'<span class="okmsg">☁ Conectado. Todo guardado en Google.</span>', guardando:'☁ Guardando…', leyendo:'☁ Buscando cambios…',
    offline:'<span class="errmsg">Sin internet: los cambios se guardan cuando vuelva la conexión.</span>', error:'<span class="errmsg">'+esc(nubeEst.msg||'No se pudo conectar.')+'</span>', off:''};
  return m[nubeEst.estado]||'';
}
function nubeFetchGet(){
  var u=nube.url+(nube.url.indexOf('?')>-1?'&':'?')+'clave='+encodeURIComponent(nube.clave||'')+'&_='+Date.now();
  return fetch(u,{cache:'no-store'}).then(function(r){ if(!r.ok) throw {status:r.status}; return r.text(); }).then(function(t){
    var j; try{ j=JSON.parse(t); }catch(e){ throw {html:true}; }
    if(!j.ok) throw {srv:j.error||'error'};
    return j;
  });
}
function nubeFetchPost(forzar){
  return fetch(nube.url,{method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({clave:nube.clave||'', base:nube.base||0, forzar:!!forzar, state:state})})
  .then(function(r){ if(!r.ok) throw {status:r.status}; return r.text(); }).then(function(t){
    var j; try{ j=JSON.parse(t); }catch(e){ throw {html:true}; }
    return j;
  });
}
function nubeErrorMsg(err){
  if(!navigator.onLine) return null;
  if(err && err.srv==='clave') return 'La clave no coincide con la del código de Google.';
  if(err && err.html) return 'Google no dejó entrar. Revisá que en “Quién tiene acceso” esté “Cualquier usuario” y que el link termine en /exec.';
  return 'No se pudo conectar con Google. Revisá el link e internet.';
}
function nubeFallo(err){
  var m=nubeErrorMsg(err);
  if(m===null) nubeSetEst('offline'); else nubeSetEst('error', m);
}
/* Revisa Google y decide: subir, bajar o preguntar */
function nubeSync(){
  if(!nubeActiva() || nubeOcupada) return Promise.resolve();
  nubeOcupada=true; nubeSetEst('leyendo');
  return nubeFetchGet().then(function(j){
    nubeOcupada=false;
    var remoto=j.state, rAt=j.updatedAt||0;
    var cambioRemoto = !!remoto && rAt !== (nube.base||0);
    var cambioLocal = !!nube.pend;
    var localVacio = !state.habs.length && !state.pers.length;
    if(!remoto){ return nubeSubir(true); }
    if(cambioRemoto && (!cambioLocal || localVacio)){ nubeAdoptar(remoto, rAt, true); return; }
    if(cambioRemoto && cambioLocal){ nubeChoque(remoto, rAt); return; }
    if(cambioLocal){ return nubeSubir(false); }
    nubeSetEst('ok');
  }).catch(function(err){ nubeOcupada=false; nubeFallo(err); });
}
function nubeAdoptar(remoto, rAt, avisar){
  state=remoto;
  state.evento=Object.assign(defaultState().evento, state.evento||{});
  ['habs','pers','tipos'].forEach(function(k){ if(!Array.isArray(state[k])) state[k]=[]; });
  if(!Array.isArray(state.evento.descartados)) state.evento.descartados=[];
  nube.base=rAt; nube.pend=false; nubeGuardarCfg(); guardarLocalSinTocar();
  undoStack=[]; dirty=false; ui.sel=null;
  nubeSetEst('ok'); render();
  if(avisar) toast('☁ Se cargó lo último guardado en Google', 3500);
}
function nubeSubir(forzar){
  if(!nubeActiva()) return Promise.resolve();
  if(nubeOcupada){ nubeProgramar(); return Promise.resolve(); }
  nubeOcupada=true; nubeSetEst('guardando');
  var at=state.updatedAt||0;
  return nubeFetchPost(forzar).then(function(j){
    nubeOcupada=false;
    if(j.ok){
      nube.base=j.updatedAt||at;
      if((state.updatedAt||0)===at) nube.pend=false;
      nubeGuardarCfg(); dirty=false;
      if(nube.pend) nubeProgramar(); else nubeSetEst('ok');
      return;
    }
    if(j.conflicto){ return nubeSync(); }
    nubeFallo({srv:j.error});
  }).catch(function(err){ nubeOcupada=false; nubeFallo(err); });
}
function nubeProgramar(){
  if(!nubeActiva()) return;
  clearTimeout(nubeTimer);
  nubeTimer=setTimeout(function(){ nubeSubir(false); }, 1500);
}
function nubeChoque(remoto, rAt){
  nubeSetEst('error','Hay cambios en dos lugares: elegí cuál conservar.');
  var fecha=function(t){ return t?new Date(t).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—'; };
  var md=abrirModal('<h2>Hay cambios en dos lugares</h2>'+
    '<p>En Google hay cambios hechos desde otro dispositivo, y en este también hay cambios que todavía no se guardaron. Elegí con cuál quedarte:</p>'+
    '<table class="tbl"><thead><tr><th></th><th>Guardado en Google</th><th>Este dispositivo</th></tr></thead><tbody>'+
    '<tr><th style="text-align:left">Último cambio</th><td>'+fecha(rAt)+'</td><td>'+fecha(state.updatedAt)+'</td></tr>'+
    '<tr><th style="text-align:left">Habitaciones</th><td>'+(remoto.habs||[]).length+'</td><td>'+state.habs.length+'</td></tr>'+
    '<tr><th style="text-align:left">Personas</th><td>'+(remoto.pers||[]).length+'</td><td>'+state.pers.length+'</td></tr>'+
    '<tr><th style="text-align:left">Con habitación</th><td>'+(remoto.pers||[]).filter(function(p){return p.habId;}).length+'</td><td>'+state.pers.filter(function(p){return p.habId;}).length+'</td></tr>'+
    '</tbody></table>'+
    '<div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">'+
      '<button class="btn primary" id="nRem">Usar lo guardado en Google</button>'+
      '<button class="btn" id="nLoc">Usar lo de este dispositivo (reemplaza lo de Google)</button>'+
    '</div><p class="small muted" style="margin-top:10px">Lo que no elijas se pierde. Si dudás, antes bajá un respaldo desde “Reunión y respaldo”.</p>');
  $('#nRem',md).onclick=function(){ cerrarModal(); nubeAdoptar(remoto, rAt, true); };
  $('#nLoc',md).onclick=function(){ cerrarModal(); nube.pend=true; nubeGuardarCfg(); nubeSubir(true); };
}
function nubeConectar(url, clave){
  nube={url:url.trim(), clave:String(clave||'').trim(), base:0, pend:(state.habs.length||state.pers.length)?true:false};
  nubeGuardarCfg(); nubeSync();
}
function nubeDesconectar(){ nube=null; nubeGuardarCfg(); nubeSetEst('off'); render(); toast('Desconectado de Google. Lo que hay queda en este dispositivo.'); }
function nubeLinkCelular(){
  var base=location.href.split('#')[0].split('?')[0];
  return base+'?nube='+encodeURIComponent(nube.url)+'&clave='+encodeURIComponent(nube.clave||'');
}
function mostrarCodigo(){
  var md=abrirModal('<h2>Código para pegar en Google</h2><p class="small muted" style="margin-top:-6px">Copialo entero y pegalo en Apps Script (el tutorial explica dónde). Acordate de cambiar la clave 1234 por la tuya.</p>'+
    '<textarea id="gsTxt" rows="14" style="font-family:ui-monospace,monospace;font-size:12px" readonly>'+esc(CODIGO_GS)+'</textarea>'+
    '<div class="foot"><button class="btn" id="gsCer">Cerrar</button><button class="btn primary" id="gsCop">Copiar código</button></div>');
  $('#gsCer',md).onclick=cerrarModal;
  $('#gsCop',md).onclick=function(){
    var ta=$('#gsTxt',md);
    try{ navigator.clipboard.writeText(CODIGO_GS).then(function(){ toast('Código copiado'); }, function(){ ta.focus(); ta.select(); toast('Seleccionado: apretá Ctrl+C'); }); }
    catch(e){ ta.focus(); ta.select(); toast('Seleccionado: apretá Ctrl+C'); }
  };
}
function cardNube(){
  if(ART) return '';
  if(!nubeActiva()){
    return '<div class="card" style="border:2px solid var(--h)"><h2>☁ Usar en varios dispositivos</h2>'+
      '<p class="small muted" style="margin-top:-4px">Conectá la app a una planilla de Google tuya y vas a ver lo mismo en la compu y en el celular. Se configura una sola vez (seguí el tutorial).</p>'+
      '<button class="btn" id="bVerCod">Ver el código para pegar en Google</button>'+
      '<div class="grid2" style="margin-top:10px">'+
        '<label class="f" style="grid-column:1/-1">Link de la aplicación web (termina en /exec)<input type="text" id="nUrl" placeholder="https://script.google.com/macros/s/…/exec"></label>'+
        '<label class="f">Clave<input type="text" id="nCla" placeholder="La que pusiste en el código"></label>'+
      '</div>'+
      '<div class="row" style="margin-top:10px"><button class="btn primary" id="bNubeCon">Conectar</button></div>'+
      '<div id="nubeEstado" class="small" style="margin-top:8px">'+nubeEstadoHtml()+'</div></div>';
  }
  var https=location.protocol==='https:';
  return '<div class="card" style="border:2px solid var(--h)"><h2>☁ Guardado en Google</h2>'+
    '<div id="nubeEstado" class="small">'+nubeEstadoHtml()+'</div>'+
    '<p class="small muted">Cada cambio se guarda solo en tu planilla de Google. Si abrís la app en otro dispositivo, se carga lo último.</p>'+
    '<div class="row"><button class="btn" id="bNubeSync">⟳ Buscar cambios ahora</button>'+
    (https?'<button class="btn" id="bNubeCel">📱 Copiar link para el celular</button>':'')+
    '<button class="btn ghost" id="bNubeDes">Desconectar</button></div>'+
    (https?'<p class="small muted" style="margin-top:8px">“Copiar link para el celular”: mandátelo por WhatsApp y abrilo en el celular. La app queda conectada sola.</p>':'')+
  '</div>';
}
function bindNube(){
  if($('#bVerCod')) $('#bVerCod').onclick=mostrarCodigo;
  if($('#bNubeCon')) $('#bNubeCon').onclick=function(){
    var u=$('#nUrl').value.trim(), c=$('#nCla').value.trim();
    if(!nubeUrlOk(u)){ toast('Ese link no parece el de la aplicación web de Google (tiene que empezar con https://script.google.com)', 6000); return; }
    if(!c){ toast('Escribí la clave'); $('#nCla').focus(); return; }
    nubeConectar(u,c); render();
  };
  if($('#bNubeSync')) $('#bNubeSync').onclick=function(){ if(nube.pend) nubeSubir(false); else nubeSync(); };
  if($('#bNubeDes')) $('#bNubeDes').onclick=function(){ confirmar('Desconectar de Google','<p>Este dispositivo deja de guardar en Google. Lo que ya está en Google no se borra.</p>','Desconectar').then(function(ok){ if(ok) nubeDesconectar(); }); };
  if($('#bNubeCel')) $('#bNubeCel').onclick=function(){ copiarTexto(nubeLinkCelular()); };
}
function nubeArrancar(){
  try{
    var q=new URLSearchParams(location.search);
    if(q.get('nube') && nubeUrlOk(q.get('nube'))){
      nube={url:q.get('nube'), clave:q.get('clave')||'', base:0, pend:false};
      nubeGuardarCfg();
      history.replaceState(null,'',location.pathname+location.hash);
      toast('☁ App conectada a Google', 3500);
    }
  }catch(e){}
  if(!nubeActiva()) return;
  nubeSync();
  setInterval(function(){ if(!document.hidden && !nube.pend) nubeSync(); }, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && nubeActiva()){ if(nube.pend) nubeSubir(false); else nubeSync(); } });
  window.addEventListener('online', function(){ if(nubeActiva()){ if(nube.pend) nubeSubir(false); else nubeSync(); } });
}

/* ---------- capacidades ---------- */
function initCaps(){
  var tries=0;
  var enMarco=false; try{ enMarco = window.self!==window.top; }catch(e){ enMarco=true; }
  if(location.protocol==='file:' || !enMarco){ capsReady=true; render(); arrancarChequeo(); nubeArrancar(); return; }
  (function esperar(){
    if(window.claude && typeof window.claude.use==='function'){
      Promise.all([
        window.claude.use('artifact').catch(function(){return null;}),
        window.claude.use('downloads').catch(function(){return null;}),
        window.claude.use('mcp').catch(function(){return null;})
      ]).then(function(r){ ART=r[0]; DL=r[1]; MCP=r[2]; capsReady=true; render(); arrancarChequeo(); nubeArrancar(); });
    } else if(++tries<40){ setTimeout(esperar,100); }
    else { capsReady=true; render(); arrancarChequeo(); nubeArrancar(); }
  })();
}

/* ---------- inicio ---------- */
renderShell();
bindViewEvents();
leerHash();
render();
initCaps();
})();
</script>
